name: Gamely
options:
  bundleIdPrefix: com.gamely
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 版本號只改這裡
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "10"
  configs:
    Release:
      DEAD_CODE_STRIPPING: YES
      STRIP_INSTALLED_PRODUCT: YES
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
schemes:
  Gamely:
    build:
      targets:
        Gamely: all
        GamelyTests: [test]
    test:
      targets:
        - GamelyTests
targets:
  Gamely:
    type: application
    platform: macOS
    sources:
      - Gamely
    # 簽章設定在 Config/Signing.xcconfig；本機憑證放 Signing.local.xcconfig（不進版控）
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # 沿用舊的 bundle ID：使用者的設定與暫停中保存的熱角都存在這個網域
        PRODUCT_BUNDLE_IDENTIFIER: com.gamely.app
        PRODUCT_NAME: Gamely
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gamely
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # 自簽憑證沒有 Team ID，除錯版開 hardened runtime 會載不進 Gamely.debug.dylib
        Release:
          ENABLE_HARDENED_RUNTIME: YES
  GamelyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - GamelyTests
    dependencies:
      - target: Gamely
    # 測試 bundle 要和 app 同一個簽章身分，否則 hardened runtime 不讓它載入
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Gamely.app/Contents/MacOS/Gamely
